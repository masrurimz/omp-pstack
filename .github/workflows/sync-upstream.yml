name: sync-upstream

on:
  schedule:
    - cron: "17 5 * * *" # daily 05:17 UTC
  workflow_dispatch: {}

permissions:
  contents: write
  pull-requests: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch upstream pstack and apply
        run: bash scripts/sync-upstream.sh

      - name: Open sync PR if changed
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          branch: chore/upstream-pstack-sync
          delete-branch: true
          title: "chore: sync upstream cursor/plugins pstack"
          commit-message: "chore: sync upstream pstack"
          body: |
            Automated daily sync from [cursor/plugins/pstack](https://github.com/cursor/plugins/tree/main/pstack).

            - Port-owned files are never overwritten: `poteto-mode/SKILL.md`, `pstack-omp/`, `orchestrate-omp/`.
            - `poteto-mode` playbooks + references sync from upstream — **review these for Cursor-specific references** that need the OMP adaptation.
            - All other upstream skills copy verbatim (framework-neutral SKILL.md).
