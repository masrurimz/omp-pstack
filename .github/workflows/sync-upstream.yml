name: sync-upstream

on:
  schedule:
    - cron: "17 5 * * *" # daily 05:17 UTC
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch upstream pstack and apply
        run: bash scripts/sync-upstream.sh

      - name: Commit and push if changed
        run: |
          git config user.name "omp-pstack-bot"
          git config user.email "actions@github.com"
          if ! git diff --cached --quiet; then
            git commit -m "chore: sync upstream pstack (run ${{ github.run_id }})"
            git push
            echo "pushed sync commit"
          else
            echo "upstream in sync — nothing pushed"
          fi
